name: Publish to npm

# Publishes the package when a GitHub release is published.
# Needs a repository secret named NPM_TOKEN (an npm "Automation" access token).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm record where the package was built

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # prepublishOnly runs the type check, the tests and the library build.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
